name: Verify Actions lockfile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Actions lockfile
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Actions lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      # Fail if workflow coverage is incomplete or a locked pin no longer verifies upstream.
      - name: Verify Actions lockfile
        run: gh actions-lock --verify
