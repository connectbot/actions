name: Prepare release
on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Prefix for git tags ('v' for v1.2.3, '' for 1.2.3)"
        type: string
        default: "v"
      gradle_no_push_prop:
        description: "Gradle property name that suppresses git pushing"
        type: string
        default: "release.noPush"
      java_version:
        description: "JDK version to set up"
        type: string
        default: "17"
      java_distribution:
        description: "JDK distribution"
        type: string
        default: "zulu"
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RELEASE_ACTOR: ${{ github.event.sender.login }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ inputs.java_distribution }}
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Create release app token
        id: release-app-token
        uses: octo-sts/action@2ea63db88c2be45e0d1dd46ecb820021eec01439 # main
        with:
          domain: ${{ vars.OCTO_STS_DOMAIN }}
          scope: ${{ format('{0}/.github', github.repository_owner) }}
          identity: ${{ format('{0}-release-prepare', github.event.repository.name) }}

      - name: Prepare release
        id: release
        uses: $/prepare
        with:
          tag_prefix: ${{ inputs.tag_prefix }}
          gradle_no_push_prop: ${{ inputs.gradle_no_push_prop }}
          push_token: ${{ steps.release-app-token.outputs.token }}
          gh_token: ${{ steps.release-app-token.outputs.token }}

      - name: Comment on setup failure
        if: failure() && steps.release.outcome != 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Prepare release setup failed. Open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, fix the failed setup step, then use Re-run failed jobs."
