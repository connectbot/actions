name: Publish release
on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Prefix for git tags ('v' for v1.2.3, '' for 1.2.3)"
        type: string
        default: "v"
permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  publish:
    name: Publish release tag and branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RELEASE_ACTOR: ${{ github.event.sender.login }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Create release app token
        id: release-app-token
        uses: octo-sts/action@2ea63db88c2be45e0d1dd46ecb820021eec01439 # main
        with:
          domain: ${{ vars.OCTO_STS_DOMAIN }}
          scope: ${{ format('{0}/.github', github.repository_owner) }}
          identity: ${{ format('{0}-release-publish', github.event.repository.name) }}

      - name: Publish release
        id: publish
        uses: $/publish
        with:
          tag_prefix: ${{ inputs.tag_prefix }}
          push_token: ${{ steps.release-app-token.outputs.token }}
          gh_token: ${{ steps.release-app-token.outputs.token }}

      - name: Comment on setup failure
        if: failure() && steps.publish.outcome != 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Publish release setup failed. Open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, fix the failed setup step, then use Re-run failed jobs."
