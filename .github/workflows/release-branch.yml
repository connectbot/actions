name: Create release branch
on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  branch:
    name: Create maintenance branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      RELEASE_ACTOR: ${{ github.event.sender.login }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Create release app token
        id: release-app-token
        uses: octo-sts/action@b6a4c9287012d2e1d2477d4f25d6f35de668e2d3 # main
        with:
          domain: ${{ vars.OCTO_STS_DOMAIN }}
          scope: ${{ format('{0}/.github', github.repository_owner) }}
          identity: ${{ format('{0}-release-branch', github.event.repository.name) }}

      - name: Create branch
        id: branch
        uses: $/branch
        with:
          push_token: ${{ steps.release-app-token.outputs.token }}
          gh_token: ${{ steps.release-app-token.outputs.token }}

      - name: Comment on setup failure
        if: failure() && steps.branch.outcome != 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "Create release branch setup failed. Open $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, fix the failed setup step, then use Re-run failed jobs."
