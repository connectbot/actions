name: Verify and attest signed Android release
on:
  workflow_call:
    inputs:
      source_run:
        type: number
        required: true
      source_attempt:
        type: number
        required: true
    outputs:
      artifact_id:
        description: Immutable verified publishing handoff
        value: ${{ jobs.attest.outputs.artifact_id }}
      manifest_sha256:
        description: SHA-256 of the attested release manifest
        value: ${{ jobs.attest.outputs.manifest_sha256 }}
permissions:
  contents: read
concurrency:
  group: signer-finalize-${{ inputs.source_run }}-${{ inputs.source_attempt }}
  cancel-in-progress: false
jobs:
  attest:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.handoff.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Load approved organization policy
        uses: $/android-signer
        with:
          command: policy
          out: ${{ runner.temp }}/signer-policy.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '25'
      - name: Verify both signing transactions
        uses: $/android-signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          command: prepare
          source-run: ${{ inputs.source_run }}
          source-attempt: ${{ inputs.source_attempt }}
          policy: ${{ runner.temp }}/signer-policy.json
          out: ${{ runner.temp }}/verified-release
          tools: ${{ runner.temp }}/reference-tools
      - name: Attest final signed files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/verified-release/oss/app-signed.apk
            ${{ runner.temp }}/verified-release/oss/app-signed.aab
            ${{ runner.temp }}/verified-release/google/app-signed.apk
            ${{ runner.temp }}/verified-release/google/app-signed.aab
            ${{ runner.temp }}/verified-release/publish/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/verified-release/predicate.json
          create-storage-record: false
      - name: Seal verified publishing handoff
        id: seal
        uses: $/android-signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          command: seal
          policy: ${{ runner.temp }}/signer-policy.json
          out: ${{ runner.temp }}/verified-release
          bundle: ${{ steps.provenance.outputs.bundle-path }}
      - name: Preserve immutable publishing handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-publishing-${{ inputs.source_run }}-${{ inputs.source_attempt }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release/publish/
          if-no-files-found: error
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-verification-${{ inputs.source_run }}-${{ inputs.source_attempt }}
          path: |
            ${{ runner.temp }}/verified-release/verification.json
            ${{ runner.temp }}/verified-release/predicate.json
            ${{ runner.temp }}/verified-release/final.sigstore.json
          if-no-files-found: warn
