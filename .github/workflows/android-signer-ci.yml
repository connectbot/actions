name: Android signer tests
on:
  push:
    branches: [main, android-signer-v1]
  pull_request:
    branches: [main, android-signer-v1]
permissions:
  contents: read
jobs:
  test:
    name: Android signer contract tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./android-signer/runtime
        with:
          tools: python java
      - name: Install hash-pinned trust verifier dependencies
        run: bash android-signer/scripts/install-trust.sh "$RUNNER_TEMP/signer-trust-venv"
      - name: Verify action contracts and adversarial publishing cases
        run: '"$RUNNER_TEMP/signer-trust-venv/bin/python" -m unittest discover -s android-signer/tests -v'
      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/android-signer-ci.yml .github/workflows/android-attest.yml .github/workflows/android-finalize.yml .github/workflows/android-publish.yml
