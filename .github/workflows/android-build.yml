name: Trusted Android build and provenance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  release:
    name: Release ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Build release APK and bundle
        env:
          FLAVOR_TASK: ${{ matrix.task }}
          IS_PUSH: ${{ (github.event_name == 'push') }}
        run: |
          tasks=(":app:assemble${FLAVOR_TASK}Release")
          if [[ "$IS_PUSH" == 'true' ]]; then
            tasks+=(":app:bundle${FLAVOR_TASK}Release")
          fi
          ./gradlew --no-build-cache --no-configuration-cache --profile "${tasks[@]}"

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-profile-release-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare stable signing inputs
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir unsigned
          cp "app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release-unsigned.apk" unsigned/app.apk
          cp "app/build/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab" unsigned/app.aab

      - name: Store immutable unsigned inputs
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: unsigned/
          if-no-files-found: error

      - name: Prepare release support files
        if: ${{ github.event_name == 'push' }}
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          mkdir support
          cp "app/build/outputs/native-debug-symbols/${FLAVOR}Release/native-debug-symbols.zip" support/
          cp "app/build/outputs/mapping/${FLAVOR}Release/mapping.txt" support/

      - name: Record release metadata
        if: ${{ github.event_name == 'push' }}
        uses: $/android-signer
        with:
          command: build-info
          out: support
          profile: ${{ matrix.flavor }}
          version-code-file: app/build/outputs/app_versioning/${{ matrix.flavor }}Release/version_code.txt

      - name: Store immutable release support files
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-support-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: support/
          if-no-files-found: error

  attest-unsigned:
    name: Attest unsigned ${{ matrix.flavor }}
    if: ${{ github.event_name == 'push' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        flavor: [oss, google]
    steps:
      - name: Download this attempt's immutable inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: unsigned/
      - name: Download this attempt's release support files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-support-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: support/
      - name: Attest original APK, AAB, and release support files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            unsigned/app.apk
            unsigned/app.aab
            support/mapping.txt
            support/native-debug-symbols.zip
            support/build-info.json
          create-storage-record: false
      - name: Preserve provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          FLAVOR: ${{ matrix.flavor }}
        run: cp "$BUNDLE" "provenance-${FLAVOR}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ matrix.flavor }}-${{ github.run_attempt }}
          path: provenance-${{ matrix.flavor }}.json
          if-no-files-found: error
