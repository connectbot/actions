name: Publish verified Android release
on:
  workflow_call:
    inputs:
      artifact_id:
        type: string
        required: true
      manifest_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  github:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-github-${{ github.repository_id }}-${{ inputs.manifest_sha256 }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Load approved organization policy
        uses: $/android-signer
        with:
          command: policy
          out: ${{ runner.temp }}/signer-policy.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/publish
          merge-multiple: true
      - name: Verify and publish GitHub release
        uses: $/android-signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          command: github
          policy: ${{ runner.temp }}/signer-policy.json
          out: ${{ runner.temp }}/publish
          manifest-sha256: ${{ inputs.manifest_sha256 }}
          report: ${{ runner.temp }}/github-publication.json
      - name: Preserve publication result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-publication.json
          if-no-files-found: error
  play:
    if: ${{ vars.PLAY_ALPHA_ENABLED == 'true' && github.repository == 'connectbot/connectbot' && github.repository_id == '123235' && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: play-alpha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-play-org-connectbot-alpha
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Load approved organization policy
        uses: $/android-signer
        with:
          command: policy
          out: ${{ runner.temp }}/signer-policy.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/publish
          merge-multiple: true
      - name: Verify publishing handoff before Google authentication
        uses: $/android-signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        with:
          command: verify
          policy: ${{ runner.temp }}/signer-policy.json
          out: ${{ runner.temp }}/publish
          manifest-sha256: ${{ inputs.manifest_sha256 }}
      - name: Obtain short-lived Play credentials
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: api-4664730880327298161-873945
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish verified Google bundle to alpha
        uses: $/android-signer
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
          SIGNER_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        with:
          command: play
          policy: ${{ runner.temp }}/signer-policy.json
          out: ${{ runner.temp }}/publish
          manifest-sha256: ${{ inputs.manifest_sha256 }}
          report: ${{ runner.temp }}/play-publication.json
      - name: Preserve publication result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/play-publication.json
          if-no-files-found: error
